kind = "web"
previewPath = "/"
title = "Employee Attendance"
version = "1.0.0"
id = "artifacts/attendance-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19377

[services.development]
run = "pnpm --filter @workspace/attendance-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/attendance-app", "run", "build" ]
run = "pnpm --filter @workspace/attendance-app run serve"

[services.env]
PORT = "19377"
BASE_PATH = "/"
