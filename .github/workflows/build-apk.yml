name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Workspace Libraries
        run: pnpm run typecheck:libs

      - name: Build Frontend (React + Vite)
        working-directory: artifacts/attendance-app
        env:
          PORT: 8081
          VITE_API_URL: https://asad--nickasad160392.replit.app
        run: pnpm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor
        working-directory: artifacts/attendance-app
        run: |
          pnpm add @capacitor/core @capacitor/android
          pnpm add -D @capacitor/cli

      - name: Create Capacitor Config
        working-directory: artifacts/attendance-app
        run: |
          cat > capacitor.config.ts << 'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';
          const config: CapacitorConfig = {
            appId: 'com.kantor.absensi',
            appName: 'Absensi App',
            webDir: 'dist',
            android: { allowMixedContent: true },
            server: { androidScheme: 'https', cleartext: true },
          };
          export default config;
          EOF

      - name: Add Android Platform
        working-directory: artifacts/attendance-app
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: artifacts/attendance-app
        run: npx cap sync android

      - name: Add Android Permissions
        working-directory: artifacts/attendance-app/android
        run: |
          MANIFEST="app/src/main/AndroidManifest.xml"
          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <application|' $MANIFEST

      - name: Build APK
        working-directory: artifacts/attendance-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AbsensiApp-APK
          path: artifacts/attendance-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
