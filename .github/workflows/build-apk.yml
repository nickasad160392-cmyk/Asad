name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Workspace Libraries
        run: pnpm run typecheck:libs

      - name: Build Frontend (React + Vite)
        working-directory: artifacts/attendance-app
        run: |
          cat > vite.config.ts << 'VEOF'
          import { defineConfig } from "vite";
          import react from "@vitejs/plugin-react";
          import tailwindcss from "@tailwindcss/vite";
          import path from "path";
          export default defineConfig({
            base: "./",
            plugins: [react(), tailwindcss()],
            resolve: {
              alias: { "@": path.resolve(import.meta.dirname, "src") },
              dedupe: ["react", "react-dom"],
            },
            build: {
              outDir: path.resolve(import.meta.dirname, "dist"),
              emptyOutDir: true,
            },
          });
          VEOF
          pnpm run build

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor
        working-directory: artifacts/attendance-app
        run: |
          pnpm add @capacitor/core @capacitor/android
          pnpm add -D @capacitor/cli

      - name: Create Capacitor Config
        working-directory: artifacts/attendance-app
        run: |
          cat > capacitor.config.ts << 'CEOF'
          import type { CapacitorConfig } from '@capacitor/cli';
          const config: CapacitorConfig = {
            appId: 'com.kantor.absensi',
            appName: 'Absensi',
            webDir: 'dist',
            server: {
              url: 'https://asad--nickasad160392.replit.app',
              cleartext: true,
            },
          };
          export default config;
          CEOF

      - name: Add Android Platform
        working-directory: artifacts/attendance-app
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: artifacts/attendance-app
        run: npx cap sync android

      - name: Add Android Permissions
        working-directory: artifacts/attendance-app/android
        run: |
          MANIFEST="app/src/main/AndroidManifest.xml"
          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <application|' $MANIFEST

      - name: Set App Name and Icon
        working-directory: artifacts/attendance-app/android
        run: |
          sed -i 's|android:label="[^"]*"|android:label="Absensi"|g' app/src/main/AndroidManifest.xml
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">Absensi</string>|g' app/src/main/res/values/strings.xml
          echo "App name set to Absensi"
          urllib.request.urlretrieve("https://i.imgur.com/Kahuyyx.png", "/tmp/icon.png")
          img = Image.open("/tmp/icon.png").convert("RGBA")
          sizes = {"mipmap-mdpi":48,"mipmap-hdpi":72,"mipmap-xhdpi":96,"mipmap-xxhdpi":144,"mipmap-xxxhdpi":192}
          for folder, size in sizes.items():
              out = f"app/src/main/res/{folder}"
              os.makedirs(out, exist_ok=True)
              img.resize((size, size), Image.LANCZOS).save(f"{out}/ic_launcher.png")
              img.resize((size, size), Image.LANCZOS).save(f"{out}/ic_launcher_round.png")
              print(f"✅ {folder}: {size}x{size}")
          PYEOF

      - name: Build APK
        working-directory: artifacts/attendance-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AbsensiApp-APK
          path: artifacts/attendance-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30